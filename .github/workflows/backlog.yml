name: Backlog

# The pre-commit hook lints docs/queue/ locally, but that config is not cloned
# with the repo. This holds the same rules on pushes and PRs, and adds the
# ID-claim check, which needs full history and the remote.
on:
  push:
    branches:
      - main
    paths:
      - docs/queue/**
      - scripts/queue.py
      - Makefile
  pull_request:
    paths:
      - docs/queue/**
      - scripts/queue.py
      - Makefile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint docs/queue
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint backlog
        run: make backlog-lint
