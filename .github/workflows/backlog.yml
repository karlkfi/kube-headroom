name: Backlog

# The pre-commit hook lints docs/STATUS.md locally, but that config is not
# cloned with the repo — this enforces the same format on pushes and PRs.
on:
  push:
    branches:
      - main
    paths:
      - docs/STATUS.md
      - scripts/lint-backlog.sh
  pull_request:
    paths:
      - docs/STATUS.md
      - scripts/lint-backlog.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint docs/STATUS.md
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint backlog
        run: bash scripts/lint-backlog.sh docs/STATUS.md
