name: website

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "scripts/check-site-metadata.py"
      - "scripts/stamp-landing.py"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "scripts/check-site-metadata.py"
      - "scripts/stamp-landing.py"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build docs (VitePress)
        working-directory: website
        run: npm run docs:build
      - name: Assemble site
        run: |
          make site-landing
          mkdir -p dist/docs
          cp -r website/.vitepress/dist/. dist/docs/
      # Runs on the assembled tree, not the sources: the docs half of the site
      # only grows its canonical and description tags at render time.
      - name: Check site metadata
        run: make site-metadata
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
